name: Gerar LumenSolar.exe

on:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Build + Empacotar Windows
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload instalador
        uses: actions/upload-artifact@v4
        with:
          name: LumenSolar-Windows
          path: |
            release/**/*.exe
            release/**/*.msi
          retention-days: 30
